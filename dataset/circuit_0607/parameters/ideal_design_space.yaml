schema_version: 2
circuit_id: circuit_0607
circuit_type: "sample-and-hold and translinear circuits"
scope: ideal_device_parameters_only
model_library:
  ideal_level1_nmos:
    device_type: nmos
    model_type: SPICE_level_1
    level: 1
    model_parameters:
      VTO:
        optimizable: false
        default: 0.7
        unit: V
      KP:
        optimizable: false
        default: 200.0
        unit: uA/V^2
      LAMBDA:
        optimizable: false
        default: 0.02
        unit: "1/V"
  ideal_resistor:
    device_type: resistor
    model_type: ideal_linear_resistor
  ideal_capacitor:
    device_type: capacitor
    model_type: ideal_linear_capacitor
device_design_space:
  R0:
    device_type: resistor
    model_parameter: R0_model
    selectable_models:
      - ideal_resistor
    parameters:
      R:
        data_type: continuous
        minimum: 1.0
        maximum: 1000000000.0
        default: 10000.0
        unit: Ohm
        scale: log
        constraint_source: GF180MCU_model_envelope_search_bound
      W:
        data_type: continuous
        minimum: 0.8
        maximum: 100.0
        default: 1.0
        unit: um
        scale: log
        constraint_source: GF180MCU_limit
      L:
        data_type: continuous
        minimum: 0.42
        maximum: 1000.0
        default: 10.0
        unit: um
        scale: log
        constraint_source: GF180MCU_limit
      m:
        data_type: continuous
        minimum: 1
        maximum: 100
        default: 1
        unit: unitless
        scale: linear
        constraint_source: GF180MCU_limit
        integer_only: true
