  range:
    minimum: 0.0
    maximum: 10.0
  relational_constraint: "VSS <= value <= VDD"
  waveform_constraints:
    low_minimum: 0.0
    high_maximum: 10.0
    minimum_rise_fall_time: 1e-12
    frequency_minimum_Hz: 1.0
    frequency_maximum_Hz: 1000000000.0
VCLK2:
  source_port: VCLK2
  parameter_type: clock_or_switch_control
  value_type: continuous
  optimizable: true
  default: 0.0
  unit: V
  range:
    minimum: 0.0
    maximum: 10.0
  relational_constraint: "VSS <= value <= VDD"
  waveform_constraints:
    low_minimum: 0.0
    high_maximum: 10.0
