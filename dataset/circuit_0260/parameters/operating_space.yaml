    minimum: 0.0
    maximum: 10.0
  relational_constraint: VSS <= value <= VDD
VCLK1:
  source_port: VCLK1
  parameter_type: clock_voltage
  value_type: continuous
  optimizable: true
  default: 0.0
  unit: V
