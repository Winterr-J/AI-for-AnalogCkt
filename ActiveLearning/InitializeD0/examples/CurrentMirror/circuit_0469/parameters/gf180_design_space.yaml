notes:
  model_scope: all documented scalable GF180MCU MOS, resistor, and capacitor choices relevant to source device types
  model_dependent_constraints: apply the W/L/m/nf limits under the selected model
  separation_note: Operating values are stored separately in operating_space.yaml
  extended_device_note: GF180 BJT choices are fixed geometries; diode W/L bounds follow installed PCells; no native scalable
    inductor model is present in the installed open PDK
  hierarchy_note: Transmission gates and logic symbols are non-primitive templates and must be expanded to MOS subcircuits
    before device sizing
constraint_sources:
  LV_MOS_models: https://gf180mcu-pdk.readthedocs.io/en/latest/analog/model_parameters/LV/LV_1_4_1.html
  LV_MOS_limits: https://gf180mcu-pdk.readthedocs.io/en/latest/analog/model_parameters/LV/LV_1_5_1.html
  10V_MOS_models_and_limits: https://gf180mcu-pdk.readthedocs.io/en/latest/analog/model_parameters/HV/HV_1_2.html
  resistor_models: https://gf180mcu-pdk.readthedocs.io/en/latest/analog/model_parameters/LV/LV_4.html
  MIM_rules: https://gf180mcu-pdk.readthedocs.io/en/latest/physical_verification/design_manual/drm_10_4_1.html
  BJT_catalog: installed GF180MCU docs analog/model_parameters/LV/tables_clear/05_BJTs.csv
  diode_catalog: installed GF180MCU docs analog/model_parameters/LV/tables_clear/04_Diodes.csv
  diode_PCell_limits: installed gf180mcu_fd_pr cells/klayout/pymacros/cells/diode.py
  inductor_availability: installed open GF180MCU PDK contains IND_MK layout guidance but no characterized scalable SPICE inductor
    model
circuit_type: current mirrors
