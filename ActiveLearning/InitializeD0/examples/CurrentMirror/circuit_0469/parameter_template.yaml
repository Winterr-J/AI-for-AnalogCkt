    admissible_range:
      lower: -0.01
      upper: -0.000001
      scale: log-magnitude
      transform: log_magnitude
      fixed_sign: negative
    discrete_options: []
    range_status: VALID
    range_source: IDEAL_BIAS_CURRENT_MAGNITUDE_RANGE_V1
