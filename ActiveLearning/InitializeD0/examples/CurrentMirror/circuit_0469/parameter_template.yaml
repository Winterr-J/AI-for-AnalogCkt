bindings:
  - binding_id: bind_IB1_identity
    relation_type: identity
    members: [IB1]
    expression: "IB1 = X.IB1"
    independent_variable: IB1
    dependent_variables: []
  - binding_id: bind_R0_identity
    relation_type: identity
    members: [R0.resistance]
    expression: "R0.resistance = X.R0"
    independent_variable: R0
    dependent_variables: []
  - binding_id: bind_R1_identity
    relation_type: identity
    members: [R1.resistance]
    expression: "R1.resistance = X.R1"
    independent_variable: R1
    dependent_variables: []
  - binding_id: bind_shared_npn_model
    relation_type: shared_parameter
    members: [Q0.model, Q1.model]
    expression: "Q0.model = Q1.model = NPN_MODEL"
    independent_variable: NPN_MODEL
    dependent_variables: [Q0.model, Q1.model]
relation_audit:
  equality: []
  shared_parameter: [bind_shared_npn_model]
  ratio: []
  topology_constraint: [constraint_IOUT1_not_in_X, constraint_fixed_ideal_npn_model]
constraints:
  - constraint_id: constraint_IOUT1_not_in_X
    type: operating_condition_exclusion
    expression: "IOUT1 not in optimization_space.variables"
    source: frozen Stage A T2_OUTPUT_COMPLIANCE and Held-out Gold H3-O01
    applies_to: [IOUT1]
  - constraint_id: constraint_fixed_ideal_npn_model
    type: fixed_process_constraint
    expression: "NPN_MODEL = NPN_IDEAL"
    source: simulation/parameter/ideal_param.yaml
    applies_to: [NPN_MODEL, Q0, Q1]
optimization_space:
  variables: [IB1, R0, R1]
  dimension_before_binding: 3
  effective_dimension_after_binding: 3
validation:
  all_optimization_parameters_have_ranges: true
  all_units_resolved: true
  all_bindings_explicit: true
  operating_conditions_excluded_from_X: true
  unresolved_items: []
provenance:
  stage_a: param_extraction.stage_a frozen runtime pipeline
  stage_b: param_extraction.stage_b IdealRangeProvider v1 frozen runtime pipeline
  nominal_values:
    - dataset/circuit_0469/simulation/parameter/ideal_param.yaml
    - dataset/circuit_0469/simulation/results/ideal/op_results.yaml
    - dataset/circuit_0469/topology/circuit_0469.py
